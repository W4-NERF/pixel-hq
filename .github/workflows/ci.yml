name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check --output-format=github .
      - name: JS syntax (node --check)
        run: python tools/jscheck.py
      - name: JS line and function length
        run: python tools/jslint.py
      - name: Python function length
        run: python tools/funclen.py
      - name: Palette contrast
        run: python tools/contrast.py

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Offline test suite
        run: python -m pytest -q --basetemp="$RUNNER_TEMP/pytest"
      - name: Render the standalone demo page
        run: python pixelhq/render.py --demo

  smoke:
    # The full suite relies on POSIX file modes; on Windows and macOS the plugin is at least loaded and rendered.
    name: Demo render (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Render the standalone demo page
        run: python pixelhq/render.py --demo
