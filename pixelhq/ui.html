<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel HQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap');
:root{--bg:#0B0F14;--bg2:#10161E;--card:#131B24;--card2:#18222D;--fg:#DCE4EC;--mut:#7E8B99;--mut2:#93A1AF;
--line:rgba(206,220,235,0.14);--olive:#7E9A52;--rust:#C1652E;--amber:#C9A23F;--green:#5FA36A;--px:'Silkscreen',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:13px/1.5 'IBM Plex Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.px{font-family:var(--px);letter-spacing:.04em}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.tag{display:inline-block;border:1px solid var(--line);padding:1px 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--mut2)}button.on{border-color:var(--olive);color:var(--olive)}button:disabled{opacity:.5;cursor:default}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.hdr .l{display:flex;align-items:center;gap:16px}
.hud{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.hud div{background:var(--bg);padding:8px 16px}.hud .v{font:20px var(--px)}.hud .k{font-size:10px;color:var(--mut);letter-spacing:.14em}
.spr{position:relative;image-rendering:pixelated;flex:none}.spr i{position:absolute;left:0;top:0;display:block}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);position:relative}.bar b{position:absolute;inset:1px auto 1px 1px;display:block}
.bar.xp b{background:var(--olive)}.bar.hp b{background:var(--green)}.bar.hp.low b{background:var(--rust)}.bar.at b{background:var(--mut2)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.st-running .spr{animation:bob .9s steps(2) infinite}.st-idle .spr{opacity:.75}.st-offline .spr{opacity:.3;filter:grayscale(1)}
.bub{position:absolute;top:-12px;right:-8px;font:10px var(--px);padding:0 4px;background:var(--fg);color:var(--bg);white-space:nowrap}
.bub.blocked{background:var(--rust);color:var(--fg);animation:blink 1.2s steps(2) infinite}
.bub.idle{background:var(--card2);color:var(--mut2)}.bub.offline{background:#2A3542;color:var(--mut)}
.bub.live{max-width:96px;overflow:hidden;text-overflow:ellipsis;font-size:9px;right:auto;left:-2px}.card .bub.live{max-width:64px}
.view{display:none}.view.on{display:grid}
.note{font-size:11px;color:var(--mut);border:1px dashed var(--line);padding:6px 10px}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
/* Office */
#office{grid-template-columns:1fr 380px;gap:16px;padding:16px 24px}
.floor{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-content:start}
.room{border:2px solid var(--line);background:repeating-conic-gradient(var(--bg2) 0 25%,var(--bg) 0 50%) 0 0/32px 32px;padding:12px}
.room h3{font:12px var(--px);color:var(--mut2);margin-bottom:10px;letter-spacing:.1em}
.room.main{grid-row:span var(--side,2)}
.zone{border:1px dashed var(--line);padding:8px;margin-bottom:10px;background:rgba(11,15,20,.6)}
.zone h4{font:10px var(--px);color:var(--mut2);margin-bottom:6px;letter-spacing:.1em}
.zone.q{border-color:rgba(201,162,63,.4)}.zone.q h4{color:var(--amber)}
.desks{display:flex;flex-wrap:wrap;gap:14px 8px}
.desk{width:92px;text-align:center;cursor:pointer;padding:16px 2px 4px;border:1px solid transparent;outline:none}
.desk:hover{border-color:var(--line)}.desk.sel{border-color:var(--olive)}
.desk .holder{position:relative;display:inline-block}.desk .tbl{height:8px;background:#2A3542;margin:2px 6px 4px;border-top:2px solid #3A4757}
.desk .nm{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{opacity:.15}
.srv{border:2px solid #2A3542;background:var(--bg);padding:8px;margin-bottom:8px}
.led{display:inline-block;width:6px;height:6px;margin-right:3px;background:var(--olive);animation:blink 1.4s steps(2) infinite}
.led:nth-child(2n){animation-delay:.5s}.led:nth-child(3n){background:var(--amber)}
.right{display:flex;flex-direction:column;gap:16px;min-width:0}
/* character card */
.card{background:var(--card);border:2px solid var(--olive);padding:16px;box-shadow:inset 3px 3px 0 rgba(255,255,255,.04),inset -3px -3px 0 rgba(0,0,0,.35);position:relative}
.card .lv{position:absolute;top:12px;right:14px;font:26px var(--px);color:var(--olive)}
.card .top{display:flex;gap:16px;align-items:flex-start}.card .holder{position:relative;padding-top:18px;margin-right:6px}
.card h2{font:16px var(--px);padding-right:44px;word-break:break-all}
.sec{font-size:10px;letter-spacing:.14em;color:var(--mut);margin:12px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.attr{display:grid;grid-template-columns:80px 1fr 30px;gap:6px;align-items:center;font-size:10px;margin:3px 0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:1px 8px;font-size:11px}
.ql{font-size:11px;margin:3px 0;display:flex;gap:6px}.ql .s{flex:none;font:9px var(--px);padding:1px 4px;border:1px solid var(--line);height:fit-content}
.s-running{color:var(--olive);border-color:var(--olive)!important}.s-blocked{color:var(--rust);border-color:var(--rust)!important}
.ach{display:inline-flex;gap:6px;align-items:center;font-size:10px;margin:2px 8px 2px 0;border:1px solid var(--line);padding:2px 6px}
.ach i{width:10px;height:10px;background:var(--amber);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.ach.bad i{background:var(--rust)}
/* log */
.log{border:1px solid var(--line);background:var(--card)}.log h3{font:11px var(--px);padding:8px 10px;border-bottom:1px solid var(--line);color:var(--mut2)}
.logbody{max-height:420px;overflow:auto}
.ev{padding:5px 10px;font-size:11px;border-bottom:1px solid rgba(206,220,235,.06);border-left:3px solid #2A3542}
.ev.ok{border-left-color:var(--olive)}.ev.bad{border-left-color:var(--rust)}.ev.warn{border-left-color:var(--amber)}
.ev .t{color:var(--mut);font-size:10px}.ev .mut2{overflow-wrap:anywhere}
/* leaderboard */
#board{grid-template-columns:1fr 360px;gap:16px;padding:16px 24px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{font:10px var(--px);color:var(--mut2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);letter-spacing:.08em;cursor:pointer;white-space:nowrap}
th.on{color:var(--olive)}
td{padding:5px 8px;border-bottom:1px solid rgba(206,220,235,.06);vertical-align:middle}
tr:hover td{background:var(--bg2);cursor:pointer}.rk{font:14px var(--px);color:var(--mut)}tr:nth-child(-n+3) .rk{color:var(--amber)}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px}.d-running{background:var(--olive)}.d-blocked{background:var(--rust);animation:blink 1.2s steps(2) infinite}.d-idle{background:#4A5868}.d-offline{background:#2A3542}
.mini{width:80px;display:inline-block;vertical-align:middle;margin-right:6px}
.qcell{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foot{padding:8px 24px 16px;font-size:10px;color:var(--mut)}
/* live */
#live{grid-template-columns:1fr;gap:8px;padding:16px 24px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:12px;align-items:start}
.lc{background:var(--card);border:2px solid var(--line);border-left:4px solid var(--olive);padding:10px 12px}
.lc .h{display:flex;gap:10px;align-items:center;margin-bottom:6px}.lc .h .holder{position:relative}
.lc .h .nm{font:13px var(--px)}.lc .h .cl{font-size:10px;color:var(--mut);letter-spacing:.1em;text-transform:uppercase}
.ls{border-top:1px solid rgba(206,220,235,.08);padding:6px 0 6px}.ls.sub{margin-left:18px;border-left:2px solid var(--line);padding-left:8px}
.ls .t{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls .st{font-size:12px;color:var(--olive);margin:2px 0}.ls .st.stale{color:var(--rust)}.ls .st::before{content:'▸ ';}
.ls .st.run::before{animation:blink 1.2s steps(2) infinite}
.ls .tl{font-size:11px;color:#B5C0CC;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ls .tl b{color:var(--fg)}
.ls .mt{font-size:10px;color:var(--mut2);margin-top:2px}
.src{font:9px var(--px);padding:1px 5px;border:1px solid var(--line);margin-right:6px;vertical-align:middle;color:var(--mut2)}
.src.kanban{color:var(--amber);border-color:rgba(201,162,63,.5)}.src.cron{color:#6F9AA8}.src.sub{color:#9FB27A}
.lidle{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 16px;font-size:11px}
.lidle div{display:flex;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(206,220,235,.06);overflow:hidden;white-space:nowrap}
.lidle .n{font:11px var(--px);min-width:150px}.lidle .z{color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis}
/* blocked */
#blk{grid-template-columns:1fr;gap:12px;padding:16px 24px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip .n{font-family:var(--px);margin-left:6px}
.bi{border:1px solid var(--line);border-left:4px solid #3A4757;background:var(--card);margin-bottom:6px}
.bi.c-you{border-left-color:var(--amber)}.bi.c-technical{border-left-color:var(--rust)}.bi.c-stale{border-left-color:#4A5868}.bi.c-unknown{border-left-color:var(--mut2)}.bi.c-upstream{border-left-color:var(--olive)}
.bh{display:grid;grid-template-columns:200px 1fr 150px 70px;gap:12px;align-items:center;padding:6px 10px;cursor:pointer}
.bh:hover{background:var(--bg2)}.bh .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh .who{display:flex;gap:8px;align-items:center;font-size:11px;white-space:nowrap;overflow:hidden}
.br{padding:0 10px 6px 222px;font-size:11px;color:#B5C0CC;overflow-wrap:anywhere}
.bx{display:none;padding:8px 10px 10px 222px;font-size:11px;border-top:1px dashed var(--line)}.bi.open .bx{display:block}
.bx .lab{font-size:10px;letter-spacing:.14em;color:var(--mut);margin-top:6px}
.bx pre{white-space:pre-wrap;font:inherit;color:var(--fg);overflow-wrap:anywhere}
.ctag{font:10px var(--px);padding:1px 5px;border:1px solid var(--line);white-space:nowrap}
.old{color:var(--rust)}
.ta{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:inherit;font-size:12px;padding:6px;margin:4px 0;resize:vertical}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
button.armed{border-color:var(--amber);color:var(--amber)}
button[data-act="archive"]{color:#D98A5C}
.res{font-size:11px;margin-top:4px}.res.ok{color:var(--olive)}.res.bad{color:var(--rust)}
#bres .res{border-left:3px solid var(--line);padding:2px 8px;margin:2px 0}#bres .res.ok{border-left-color:var(--olive)}#bres .res.bad{border-left-color:var(--rust)}
</style></head><body>
<header class="hdr"><div class="l"><span class="px" style="font-size:20px" id="brand">PIXEL HQ</span>
<span><button class="on" data-tab="office">Office</button> <button data-tab="live" id="livetab">Live</button> <button data-tab="board">Leaderboard</button> <button data-tab="blk" id="blktab">Blocked</button></span></div>
<div style="display:flex;gap:8px;align-items:center"><span class="tag" id="stand"></span><button id="reload">Reload</button></div></header>
<div class="hud" id="hud"></div>

<section class="view on" id="office"><div>
 <div class="filters" id="ofilter"><button class="on" data-f="all">All</button><button data-f="running">Working</button><button data-f="blocked">Blocked</button><button data-f="idle">Idle</button></div>
 <div class="floor" id="floor"></div>
 <div class="log" style="margin-top:16px"><h3>EVENT LOG</h3><div class="logbody" id="log1" style="max-height:340px"></div></div></div>
 <div class="right"><div id="detail" style="position:sticky;top:12px"></div></div>
</section>

<section class="view" id="board"><div>
 <div class="filters" id="bfilter"></div>
 <table><thead><tr><th>#</th><th></th><th data-k="id">BOT</th><th data-k="lvl" class="on">LVL</th><th data-k="xp">XP</th><th data-k="hp">HP</th><th title="pass / revise / fail">P/R/F</th><th data-k="blocked">BLOCKED</th><th>STATUS</th><th>QUEST</th><th>MODEL</th></tr></thead><tbody id="tb"></tbody></table></div>
 <div class="log"><h3>EVENT LOG</h3><div class="logbody" id="log2" style="max-height:640px"></div></div>
</section>
<section class="view" id="live">
 <div id="livenote" class="note" style="display:none"></div>
 <div class="lgrid" id="lactive"></div>
 <div class="sec" style="margin:16px 0 4px">IDLE / INACTIVE</div><div id="lidle" class="lidle"></div>
</section>
<section class="view" id="blk">
 <div class="note">Click a card for details and actions. "Answer &amp; unblock", "Retry" and "Archive" need a second click to confirm. Archiving backs up the card's workspace first (var/archived-workspaces).</div>
 <div id="bres"></div>
 <div class="chips" id="bcats"></div>
 <div class="chips"><span class="mut" style="font-size:11px">Board:</span><span id="bboards" class="chips"></span>
  <button id="bstale" style="margin-left:12px"></button>
  <button id="btriage" style="margin-left:auto;border-color:var(--olive)"></button></div>
 <div id="blist"></div>
</section>
<div class="foot" id="foot"></div>

<script>
/* Every string coming from cards, sessions or the ledger goes through esc() before it touches innerHTML. */
let DATA = /*PIXELHQ_DATA*/null;
let LIVE = null, LIVE_ERR = null;
const CFG = () => (DATA && DATA.cfg) || {locale:'en-GB', timezone:'UTC', xp:{pass:10,revise:3,fail:-5}, staleDays:14, rooms:[], operator:'operator', orchestrator:'default'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeColor = c => /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#93A1AF';
const safeId = s => String(s || '').replace(/[^a-zA-Z0-9_-]/g, '');
function liveOf(id){const v = LIVE && LIVE.bots && LIVE.bots[id]; return v || null}
function shortStep(st){if(!st)return '';let m;
 if((m=st.match(/terminal command running \((\d+)s/)))return 'terminal · '+m[1]+' s';
 if((m=st.match(/sequential tool running \((\d+)s\): (\w+)/)))return m[2]+' · '+m[1]+' s';
 if((m=st.match(/delegate_task: subagent running (\w+) \(iteration (\d+)\/(\d+)\)/)))return 'subagent '+m[2]+'/'+m[3];
 if((m=st.match(/tool running: (\w+)/)))return m[1];
 if(/receiving stream response/.test(st))return 'thinking …';
 if(/starting new turn/.test(st))return 'new turn';
 return st.length>22?st.slice(0,21)+'…':st}
function liveStatus(b){const v=liveOf(b.id);if(!v)return {status:b.status,label:null};
 if(v.active){const s=v.sessions[0];if(s)return {status:'running',label:shortStep(s.step)||'active'};const t=v.tasks[0];return {status:'running',label:t?'kanban · hb '+t.heartbeatAge+' s':'active'}}
 return {status:b.status==='running'?'idle':b.status,label:null}}
/* 8×9 pixel sprite drawn with box-shadow; leader gets a crown, quarantine zone gets amber eyes */
const SPR=["..a..a..","..XXXX..",".XXXXXX.",".XeXXeX.",".XXXXXX.","..XmmX..",".XXXXXX.","X.XXXX.X","..X..X.."];
const CROWN=["c.c..c.c","cccccccc"];
const quarantineZones=()=>new Set(CFG().rooms.flatMap(r=>(r.zones||[]).filter(z=>z.quarantine).map(z=>z.id)));
function sprite(b,px){px=px||4;let rows=SPR.slice();if(b.leader)rows=CROWN.concat(SPR.slice(1));
 if(quarantineZones().has(b.zone))rows=rows.map(r=>r.replace(/e/g,'q'));
 const col=safeColor(b.color),sh=[];rows.forEach((row,y)=>[...row].forEach((c,x)=>{const m={X:col,e:'#0B0F14',q:'#C9A23F',a:'#DCE4EC',m:'rgba(11,15,20,.5)',c:'#C9A23F'}[c];
  if(m)sh.push((x*px)+'px '+(y*px)+'px 0 '+m)}));
 return '<div class="spr" style="width:'+(8*px)+'px;height:'+(rows.length*px)+'px"><i style="width:'+px+'px;height:'+px+'px;box-shadow:'+sh.join(',')+'"></i></div>'}
const ST={running:'working',blocked:'blocked',idle:'idle',offline:'offline'};
function bubble(b){const lv=liveStatus(b);if(lv.status==='running')return '<span class="bub'+(lv.label?' live':'')+'" title="'+esc(lv.label||'')+'">'+(lv.label?esc(lv.label):'...')+'</span>';
 if(lv.status==='blocked')return '<span class="bub blocked">! '+b.blocked+'</span>';
 if(lv.status==='offline')return '<span class="bub offline">x</span>';return '<span class="bub idle">z</span>'}
const ATTR=['Precision','Stamina','Discipline','Wisdom'],ATTR_T=['correctness','completeness','format','safety'];
const fmtN=n=>Number(n||0).toLocaleString(CFG().locale);
const fmt1=(v,d)=>v==null?'–':Number(v).toLocaleString(CFG().locale,{maximumFractionDigits:d||0});
function ago(ts){if(!ts)return '–';const s=(LIVE?LIVE.generated:DATA.generated)-ts;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'}
function clock(ts){try{return new Date(ts*1000).toLocaleString(CFG().locale,{timeZone:CFG().timezone,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return new Date(ts*1000).toISOString().slice(5,16)}}
function hm(){try{return new Date().toLocaleTimeString(CFG().locale,{timeZone:CFG().timezone,hour:'2-digit',minute:'2-digit'})}catch(e){return new Date().toISOString().slice(11,16)}}
const hpTxt=b=>b.hp==null?'–':b.hp+'%';
function bars(b){return '<div class="mut" style="font-size:10px">LVL '+b.lvl+' · '+fmtN(b.xp)+' XP</div>'+(b.xpSummon?'<div class="mut" style="font-size:10px">own '+fmtN(b.xpOwn)+' · summons '+fmtN(b.xpSummon)+'</div>':'')+'<div class="bar xp"><b style="width:'+b.xpPct+'%"></b></div>'+
 '<div class="mut" style="font-size:10px;margin-top:4px">HP '+hpTxt(b)+(b.n?' · '+b.n+' reviews':' · no reviews yet')+'</div><div class="bar hp'+(b.hp!=null&&b.hp<75?' low':'')+'"><b style="width:'+(b.hp??0)+'%"></b></div>'}
function evk(kind){const x=CFG().xp,sg=n=>(n>0?'+':'')+n;
 return {'qc-pass':[sg(x.pass)+' XP · QC pass','ok'],'qc-revise':[sg(x.revise)+' XP · revision','warn'],'qc-fail':[sg(x.fail)+' XP · QC fail','bad'],completed:['quest completed','ok'],blocked:['quest blocked','bad'],
 gave_up:['gave up','bad'],timed_out:['timed out','bad'],protocol_violation:['protocol violation','warn'],suspected_hallucinated_references:['mirage: hallucinated reference','bad'],created:['new quest','']}[kind]||[kind,'']}
function logHtml(){return DATA.events.map(e=>{const k=evk(e.kind);return '<div class="ev '+k[1]+'"><span class="t">'+clock(e.ts)+'</span> <b>'+esc(e.bot)+'</b>'+(e.summon?' <span class="mut">(summon)</span>':'')+' · '+esc(k[0])+'<div class="mut2">'+esc(e.text)+'</div></div>'}).join('')||'<div class="ev">no events</div>'}
let sel=null,ofilter='all',bzone='all',bsort='lvl';
function detail(b){const a=b.attrs.map((v,i)=>'<div class="attr" title="'+ATTR_T[i]+'"><span>'+ATTR[i]+'</span><div class="bar at"><b style="width:'+(v?v*20:0)+'%"></b></div><span>'+(v??'–')+'</span></div>').join('');
 const qs=b.quests.map(q=>'<div class="ql"><span class="s s-'+esc(q.status)+'">'+esc(q.status)+'</span><span><span class="mut">'+esc(q.board)+'</span> '+esc(q.title)+'</span></div>').join('')||'<div class="mut" style="font-size:11px">no open quests</div>';
 const more=b.openQuests-b.quests.length;
 const ach=b.achievements.map(x=>'<span class="ach '+esc(x[2])+'" title="'+esc(x[1])+'"><i></i>'+esc(x[0])+'</span>').join('')||'<span class="mut" style="font-size:11px">none yet</span>';
 document.getElementById('detail').innerHTML='<div class="card st-'+b.status+'"><span class="lv">'+b.lvl+'</span><div class="top"><div class="holder">'+sprite(b,7)+bubble(b)+'</div><div style="flex:1;min-width:0"><h2>'+esc(b.id)+'</h2><div class="mut" style="font-size:11px">'+esc(b.title)+' · '+esc(b.cls)+'</div><div style="margin-top:8px">'+bars(b)+'</div></div></div>'+
